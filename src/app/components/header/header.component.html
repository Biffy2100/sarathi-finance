<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="#hero" aria-label="Sarathi home">
      <img class="brand-logo" src="assets/sarathi-logo-header.png" alt="Sarathi — Guide for Financial Freedom" />
    </a>
    <nav id="primary-navigation" [class.is-open]="menuOpen" aria-label="Primary navigation">
      <a href="#hero" (click)="closeMenu()">{{ 'Home' | t }}</a><a href="#solutions" (click)="closeMenu()">{{ 'Services' | t }}</a><a href="#why-us" (click)="closeMenu()">{{ 'Approach' | t }}</a><a href="#about" (click)="closeMenu()">{{ 'About' | t }}</a><a href="#linkedin" (click)="closeMenu()">{{ 'Blogs' | t }}</a><a href="#contact" (click)="closeMenu()">{{ 'Contact' | t }}</a><a href="#testimonials" (click)="closeMenu()">{{ 'Testimonials' | t }}</a>
    </nav>
    <select
      class="language-switcher"
      [ngModel]="translations.language()"
      (ngModelChange)="setLanguage($event)"
      aria-label="Select language">
      <option value="en">EN</option>
      <option value="hi">हिंदी</option>
      <option value="mr">मराठी</option>
    </select>
    <button
      class="mobile-menu-toggle"
      type="button"
      aria-controls="primary-navigation"
      [attr.aria-expanded]="menuOpen"
      [attr.aria-label]="menuOpen ? 'Close navigation menu' : 'Open navigation menu'"
      (click)="menuOpen = !menuOpen">
      <span>Menu</span>
      <span class="menu-icon" [class.is-open]="menuOpen" aria-hidden="true"><span></span><span></span></span>
    </button>
    <a class="header-action" href="https://wa.me/919769697658?text=Hi%20Sarathi%20team%2C%20I%20would%20like%20to%20know%20more%20about%20your%20financial%20services." target="_blank" rel="noopener noreferrer" aria-label="Chat on WhatsApp with Sarathi">
      <svg class="whatsapp-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20.52 3.48A11.8 11.8 0 0 0 12.1 1a11.9 11.9 0 0 0-10.3 18l-1.1 4.05 4.17-1.09a11.9 11.9 0 0 0 17.65-16.48Zm-8.42 18.2h-.03a9.85 9.85 0 0 1-5.01-1.37l-.36-.21-2.47.65.66-2.4-.24-.39A9.8 9.8 0 0 1 2.2 12a9.9 9.9 0 1 1 17.96 5.66A9.8 9.8 0 0 1 12.1 21.68Zm5.38-7.42c-.29-.14-1.72-.84-1.99-.94-.27-.09-.46-.14-.66.14-.2.28-.76.94-.93 1.13-.17.2-.35.22-.64.08-.29-.14-1.21-.44-2.31-1.43-.85-.76-1.44-1.7-1.61-1.98-.17-.28-.02-.43.13-.57.13-.13.29-.35.43-.52.14-.17.18-.29.28-.48.09-.2.05-.37-.02-.52-.07-.14-.66-1.58-.91-2.16-.24-.57-.48-.49-.66-.5l-.57-.01c-.2 0-.52.07-.79.37-.27.3-1.03 1-1.03 2.44s1.06 2.83 1.2 3.03c.15.2 2.07 3.17 5.02 4.45.7.3 1.25.48 1.67.62.7.22 1.35.19 1.86.11.57-.08 1.72-.7 1.96-1.38.24-.68.24-1.27.17-1.39-.07-.12-.27-.2-.57-.34Z"/></svg>
      <span>Chat with us</span>
    </a>
  </div>
</header>
