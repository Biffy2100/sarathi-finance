<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="#hero" aria-label="Sarathi home"><span class="brand-logo"><img src="assets/sarathi-logo.jpg" alt="Sarathi - Guide for Financial Freedom" /></span></a>
    <nav id="primary-navigation" [class.is-open]="menuOpen" aria-label="Primary navigation">
      <a href="#solutions" (click)="closeMenu()">Services</a><a href="#why-us" (click)="closeMenu()">Our approach</a><a href="#about" (click)="closeMenu()">About Sujit</a><a href="#linkedin" (click)="closeMenu()">LinkedIn posts</a><a href="#contact" (click)="closeMenu()">Contact</a>
    </nav>
    <button
      class="mobile-menu-toggle"
      type="button"
      aria-controls="primary-navigation"
      [attr.aria-expanded]="menuOpen"
      [attr.aria-label]="menuOpen ? 'Close navigation menu' : 'Open navigation menu'"
      (click)="menuOpen = !menuOpen">
      <span>Menu</span>
      <span class="menu-icon" [class.is-open]="menuOpen" aria-hidden="true"><span></span><span></span></span>
    </button>
    <a class="header-action" href="tel:+919769697658">Call Sujit <span aria-hidden="true">↗</span></a>
  </div>
</header>
